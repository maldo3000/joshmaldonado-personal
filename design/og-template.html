<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0c0c0c;
        font-family: 'Roboto Mono', monospace;
        color: rgba(246, 245, 239, 0.82);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 84px;
      }
      /* subtle vignette + top sheen, matching the site's matte depth */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 80% at 50% -20%, rgba(255,255,255,0.07), transparent 60%),
          radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55));
        pointer-events: none;
      }
      .inner { position: relative; z-index: 1; }
      .eyebrow {
        color: rgba(246, 245, 239, 0.52);
        font-size: 21px;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 34px;
      }
      h1 {
        color: #f6f5ef;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        margin-bottom: 30px;
        text-shadow: 0 0 34px rgba(255, 255, 255, 0.28);
      }
      .rule {
        width: 100%;
        height: 1px;
        background: rgba(255, 255, 255, 0.16);
        margin-bottom: 30px;
      }
      p.blurb {
        max-width: 830px;
        font-size: 25px;
        line-height: 1.75;
        margin-bottom: 44px;
      }
      .tags { display: flex; gap: 12px; align-items: center; }
      .tag {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 99px;
        padding: 11px 22px;
        color: rgba(246, 245, 239, 0.62);
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .domain {
        margin-left: auto;
        color: #f6f5ef;
        font-size: 17px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="inner">
      <p class="eyebrow">Creative Producer &amp; Product Manager</p>
      <h1>Josh Maldonado</h1>
      <div class="rule"></div>
      <p class="blurb">
        Creative producer and product manager working at the intersection of
        media, technology, and culture.
      </p>
      <div class="tags">
        <span class="tag">Experiential</span>
        <span class="tag">Film &amp; Content</span>
        <span class="tag">Interactive</span>
        <span class="tag">AI</span>
        <span class="domain">joshmaldonado.com</span>
      </div>
    </div>
  </body>
</html>
